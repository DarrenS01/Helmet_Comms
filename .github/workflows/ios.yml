name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS project and add permissions
        run: |
          flutter create --platforms=ios --org com.helmetcomms --project-name helmet_comms .
          git checkout -- lib/main.dart pubspec.yaml
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Helmet Comms uses the microphone for voice chat." $P
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Helmet Comms uses Bluetooth for your helmet headset." $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" $P
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr HelmetComms.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HelmetComms-ipa
          path: HelmetComms.ipa
